<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ECharts 图表示例 - 使用外部 JSON 数据</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      padding: 40px;
      max-width: 1200px;
      width: 100%;
    }

    h1 {
      color: #333;
      margin-bottom: 10px;
      font-size: 28px;
      text-align: center;
    }

    .subtitle {
      color: #666;
      text-align: center;
      margin-bottom: 30px;
      font-size: 14px;
    }

    #main {
      width: 100%;
      height: 500px;
      margin-bottom: 20px;
    }

    .loading {
      text-align: center;
      padding: 50px;
      color: #666;
      font-size: 18px;
    }

    .error {
      text-align: center;
      padding: 50px;
      color: #dc3545;
      font-size: 16px;
    }

    .data-info {
      background: #f8f9fa;
      padding: 20px;
      border-radius: 8px;
      margin-top: 20px;
    }

    .data-info h3 {
      color: #333;
      margin-bottom: 10px;
      font-size: 18px;
    }

    .data-info pre {
      background: white;
      padding: 15px;
      border-radius: 4px;
      overflow-x: auto;
      font-size: 12px;
      border: 1px solid #dee2e6;
    }

    @media (max-width: 768px) {
      .container {
        padding: 20px;
      }

      #main {
        height: 400px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📊 销售数据分析图表</h1>
    <p class="subtitle">数据从外部 JSON 文件动态加载</p>
    
    <div id="loading" class="loading">
      ⏳ 正在加载数据...
    </div>
    
    <div id="error" class="error" style="display: none;"></div>
    
    <div id="main" style="display: none;"></div>
    
    <div id="dataInfo" class="data-info" style="display: none;">
      <h3>📋 数据来源信息</h3>
      <pre id="dataSource"></pre>
    </div>
  </div>

  <!-- 引入 ECharts -->
  <script src="https://cdn.jsdelivr.net/npm/echarts@latest/dist/echarts.min.js"></script>
  
  <script>
    // ====================================
    // 这是推荐的数据加载方式
    // ====================================
    
    // 从外部 JSON 文件加载数据（替换为你的实际文件名）
    const jsonFileName = 'example-data'; // 修改为实际的 JSON 文件名
    
    fetch(`/generated-json/${jsonFileName}.json`)
      .then(response => {
        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }
        return response.json();
      })
      .then(sourceData => {
        // ====================================
        // sourceData 就是从外部加载的完整数据
        // ====================================
        
        console.log('✅ 数据加载成功:', sourceData);
        
        // 隐藏加载提示
        document.getElementById('loading').style.display = 'none';
        
        // 显示图表容器
        document.getElementById('main').style.display = 'block';
        
        // 显示数据信息
        document.getElementById('dataInfo').style.display = 'block';
        document.getElementById('dataSource').textContent = 
          `数据文件: /generated-json/${jsonFileName}.json\n` +
          `数据结构: ${JSON.stringify(Object.keys(sourceData), null, 2)}\n` +
          `工作表数量: ${Object.keys(sourceData).length}`;
        
        // ====================================
        // 使用 sourceData 进行图表渲染
        // ====================================
        
        // 假设数据在 Sheet1 中
        const chartData = sourceData.Sheet1 || sourceData[Object.keys(sourceData)[0]];
        
        if (!chartData || chartData.length === 0) {
          throw new Error('数据为空或格式不正确');
        }
        
        // 提取数据（假设数据有 name 和 value 字段）
        const categories = chartData.map(item => item.name || item.月份 || item.类别);
        const values = chartData.map(item => item.value || item.销售额 || item.数值);
        
        // 初始化 ECharts 实例
        const chart = echarts.init(document.getElementById('main'));
        
        // 配置图表选项
        const option = {
          title: {
            text: '销售数据统计',
            subtext: '数据来源: 外部 JSON 文件',
            left: 'center',
            textStyle: {
              fontSize: 24,
              fontWeight: 'bold'
            }
          },
          tooltip: {
            trigger: 'axis',
            axisPointer: {
              type: 'shadow'
            }
          },
          grid: {
            left: '3%',
            right: '4%',
            bottom: '3%',
            containLabel: true
          },
          xAxis: {
            type: 'category',
            data: categories,
            axisLabel: {
              rotate: 45,
              interval: 0
            }
          },
          yAxis: {
            type: 'value',
            name: '销售额'
          },
          series: [
            {
              name: '销售额',
              type: 'bar',
              data: values,
              itemStyle: {
                color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                  { offset: 0, color: '#667eea' },
                  { offset: 1, color: '#764ba2' }
                ])
              },
              emphasis: {
                itemStyle: {
                  color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                    { offset: 0, color: '#764ba2' },
                    { offset: 1, color: '#667eea' }
                  ])
                }
              }
            }
          ],
          dataZoom: [
            {
              type: 'inside',
              start: 0,
              end: 100
            },
            {
              start: 0,
              end: 100
            }
          ]
        };
        
        // 设置图表配置
        chart.setOption(option);
        
        // 响应式调整
        window.addEventListener('resize', () => {
          chart.resize();
        });
      })
      .catch(error => {
        // ====================================
        // 错误处理
        // ====================================
        
        console.error('❌ 数据加载失败:', error);
        
        document.getElementById('loading').style.display = 'none';
        const errorDiv = document.getElementById('error');
        errorDiv.style.display = 'block';
        errorDiv.innerHTML = `
          <h3>⚠️ 数据加载失败</h3>
          <p>${error.message}</p>
          <p>请确保以下事项：</p>
          <ul style="text-align: left; display: inline-block; margin-top: 10px;">
            <li>JSON 文件已正确保存到 /generated-json/ 目录</li>
            <li>文件名称正确（当前尝试加载: ${jsonFileName}.json）</li>
            <li>开发服务器正在运行</li>
          </ul>
        `;
      });
  </script>
</body>
</html>
