<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL批量分析系统 - 行业分类与风险评估</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 32px;
            font-weight: 700;
        }

        .subtitle {
            color: #666;
            font-size: 16px;
            margin-bottom: 20px;
        }

        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .stat-value {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 14px;
            opacity: 0.9;
        }

        .control-panel {
            background: white;
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        }

        .control-group {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .btn-success {
            background: #10b981;
            color: white;
        }

        .btn-danger {
            background: #ef4444;
            color: white;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .input-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        input[type="number"] {
            padding: 10px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            width: 150px;
        }

        .progress-section {
            background: white;
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        }

        .progress-bar-container {
            width: 100%;
            height: 30px;
            background: #f0f0f0;
            border-radius: 15px;
            overflow: hidden;
            margin-bottom: 15px;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 14px;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            color: #666;
        }

        .charts-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .chart-card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        }

        .chart-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #333;
        }

        .chart-container {
            width: 100%;
            height: 400px;
        }

        .table-card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .table-container {
            overflow-x: auto;
            max-height: 600px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        thead {
            position: sticky;
            top: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            z-index: 10;
        }

        th {
            padding: 15px;
            text-align: left;
            font-weight: 600;
        }

        td {
            padding: 12px 15px;
            border-bottom: 1px solid #f0f0f0;
        }

        tbody tr:hover {
            background: #f8f9fa;
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .badge-safe {
            background: #d1fae5;
            color: #065f46;
        }

        .badge-risk {
            background: #fee2e2;
            color: #991b1b;
        }

        .badge-unknown {
            background: #e5e7eb;
            color: #374151;
        }

        .url-cell {
            max-width: 300px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .log-container {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 20px;
            border-radius: 10px;
            max-height: 300px;
            overflow-y: auto;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 13px;
            line-height: 1.6;
        }

        .log-entry {
            margin-bottom: 5px;
        }

        .log-info {
            color: #4ec9b0;
        }

        .log-success {
            color: #4caf50;
        }

        .log-warning {
            color: #ff9800;
        }

        .log-error {
            color: #f44336;
        }

        @media (max-width: 768px) {
            .charts-row {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 24px;
            }

            .stat-card {
                padding: 15px;
            }

            .stat-value {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- 头部 -->
        <div class="header">
            <h1>🔍 URL批量分析系统</h1>
            <p class="subtitle">智能分析网站行业分类与高风险产业识别</p>

            <div class="stats-row">
                <div class="stat-card">
                    <div class="stat-value" id="totalUrls">0</div>
                    <div class="stat-label">总URL数量</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="analyzedUrls">0</div>
                    <div class="stat-label">已分析</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="riskUrls">0</div>
                    <div class="stat-label">高风险</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="safeUrls">0</div>
                    <div class="stat-label">安全</div>
                </div>
            </div>
        </div>

        <!-- 文件上传面板 -->
        <div class="control-panel">
            <h3 style="margin-bottom: 20px;">📂 数据导入</h3>
            <div class="control-group">
                <input type="file" id="fileInput" accept=".xlsx,.xls,.csv" style="display: none;">
                <button class="btn btn-primary" id="uploadBtn">
                    <span>📤</span> 选择文件（Excel/CSV）
                </button>
                <span id="fileNameDisplay" style="color: #666; font-size: 14px;">未选择文件</span>
            </div>
        </div>

        <!-- 控制面板 -->
        <div class="control-panel">
            <h3 style="margin-bottom: 20px;">⚙️ 控制面板</h3>
            <div class="control-group">
                <button class="btn btn-primary" id="startBtn" disabled>
                    <span>▶️</span> 开始分析（全部）
                </button>
                <button class="btn btn-success" id="exportBtn">
                    <span>📥</span> 导出分析数据
                </button>

                <div class="input-group">
                    <label>并发数:</label>
                    <input type="number" id="concurrentInput" value="6" min="1" max="20">
                </div>
            </div>
        </div>

        <!-- 进度条 -->
        <div class="progress-section">
            <h3 style="margin-bottom: 15px;">分析进度</h3>
            <div class="progress-bar-container">
                <div class="progress-bar" id="progressBar" style="width: 0%;">0%</div>
            </div>
            <div class="progress-info">
                <span id="progressText">等待开始...</span>
                <span id="speedText">速度: 0 URL/s</span>
            </div>

            <div class="log-container" id="logContainer" style="margin-top: 20px;">
                <div class="log-entry log-info">系统就绪，等待开始分析...</div>
            </div>
        </div>

        <!-- 图表展示 -->
        <div class="charts-row">
            <div class="chart-card">
                <div class="chart-title">📊 行业分类分布</div>
                <div class="chart-container" id="industryChart"></div>
            </div>
            <div class="chart-card">
                <div class="chart-title">⚠️ 风险等级分布</div>
                <div class="chart-container" id="riskChart"></div>
            </div>
        </div>

        <!-- 数据表格 -->
        <div class="table-card">
            <h3 style="margin-bottom: 20px;">📋 分析结果详情</h3>
            <div class="table-container">
                <table id="resultsTable">
                    <thead>
                        <tr>
                            <th>序号</th>
                            <th>URL</th>
                            <th>标题</th>
                            <th>关键词</th>
                            <th>描述</th>
                            <th>网站摘要</th>
                            <th>行业分类</th>
                            <th>风险评估</th>
                            <th>状态</th>
                        </tr>
                    </thead>
                    <tbody id="resultsTableBody">
                        <tr>
                            <td colspan="9" style="text-align: center; padding: 30px; color: #999;">
                                暂无数据，请点击"开始分析"按钮
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/echarts@latest/dist/echarts.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="../common.js"></script>
    <script src="./index.js"></script>
    <script>
        // 全局变量
        let sourceData = null;
        let analyzedResults = [];
        let isAnalyzing = false;
        let currentIndex = 0;
        let startTime = 0;
        let charts = null; // 图表实例

        // 行业关键词映射
        const industryKeywords = {
            '电子商务': ['shop', 'store', 'buy', 'sell', 'cart', 'product', 'ecommerce', 'shopping', '商城', '购物', '电商'],
            '金融服务': ['bank', 'finance', 'loan', 'credit', 'payment', 'invest', 'trading', '金融', '银行', '贷款', '投资'],
            '科技/IT': ['tech', 'software', 'app', 'code', 'dev', 'api', 'cloud', 'ai', '科技', '软件', '开发'],
            '教育培训': ['education', 'learn', 'course', 'training', 'school', 'university', '教育', '培训', '学习', '课程'],
            '医疗健康': ['health', 'medical', 'hospital', 'doctor', 'medicine', 'clinic', '医疗', '健康', '医院'],
            '房地产': ['real estate', 'property', 'house', 'rent', 'apartment', 'zillow', '房产', '租房', '地产'],
            '汽车': ['car', 'auto', 'vehicle', 'motor', 'lease', 'automotive', '汽车', '车辆'],
            '媒体/娱乐': ['media', 'news', 'blog', 'video', 'music', 'game', 'entertainment', '媒体', '娱乐', '游戏'],
            '社交网络': ['social', 'community', 'forum', 'reddit', 'facebook', 'twitter', '社交', '论坛'],
            '餐饮美食': ['food', 'restaurant', 'delivery', 'menu', 'dining', 'swiggy', '餐饮', '美食'],
            '旅游': ['travel', 'hotel', 'booking', 'tourism', 'vacation', '旅游', '酒店'],
            '企业服务': ['business', 'enterprise', 'service', 'management', 'hr', 'crm', '企业', '管理'],
        };

        // 高风险关键词
        const riskKeywords = [
            'casino', 'gambling', 'bet', 'porn', 'adult', 'xxx',
            'drugs', 'loan shark', 'scam', 'hack', 'crack',
            '博彩', '赌博', '色情', '成人', '高利贷', '诈骗', '黑客'
        ];

        // 初始化
        async function init() {
            addLog('系统就绪，请上传Excel或CSV文件', 'info');
            charts = initCharts();
        }

        // 处理文件上传
        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            // 显示文件名
            document.getElementById('fileNameDisplay').textContent = `已选择: ${file.name}`;
            addLog(`正在解析文件: ${file.name}`, 'info');

            const reader = new FileReader();

            reader.onload = function (e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });

                    // 获取第一个工作表
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];

                    // 转换为JSON
                    const jsonData = XLSX.utils.sheet_to_json(worksheet);

                    if (!jsonData || jsonData.length === 0) {
                        showError('文件解析失败：文件为空或格式不正确');
                        addLog('解析失败：文件内容为空', 'error');
                        return;
                    }

                    // 查找URL列
                    const urlColumn = findUrlColumn(jsonData[0]);

                    if (!urlColumn) {
                        showError('文件解析失败：未找到URL列\n请确保文件中包含URL相关的列（如：url、网址、链接、提取页面url等）');
                        addLog('解析失败：未找到URL列', 'error');
                        return;
                    }

                    // 提取URL并验证
                    const urls = [];
                    let emptyCount = 0;

                    jsonData.forEach((row, index) => {
                        const url = row[urlColumn];
                        if (url && String(url).trim()) {
                            urls.push({ ...row, url: String(url).trim() });
                        } else {
                            emptyCount++;
                        }
                    });

                    if (urls.length === 0) {
                        showError('文件解析失败：所有URL均为空\n请检查文件中是否包含有效的URL数据');
                        addLog('解析失败：没有有效的URL数据', 'error');
                        return;
                    }

                    // 保存数据
                    sourceData = { Sheet1: urls, urlColumn };

                    // 更新统计
                    const totalCount = urls.length;
                    document.getElementById('totalUrls').textContent = totalCount.toLocaleString();

                    // 启用开始按钮
                    document.getElementById('startBtn').disabled = false;

                    // 显示成功信息
                    let logMessage = `文件解析成功！共 ${totalCount} 条有效URL记录`;
                    if (emptyCount > 0) {
                        logMessage += `（跳过 ${emptyCount} 条空记录）`;
                        addLog(`警告：发现 ${emptyCount} 条空URL记录已被跳过`, 'warning');
                    }
                    addLog(logMessage, 'success');
                    addLog(`URL列名: ${urlColumn}`, 'info');

                } catch (error) {
                    showError('文件解析失败：' + error.message + '\n请确保文件格式正确（支持.xlsx、.xls、.csv格式）');
                    addLog(`解析错误: ${error.message}`, 'error');
                    console.error('File parse error:', error);
                }
            };

            reader.onerror = function () {
                showError('文件读取失败：无法读取文件\n请检查文件是否损坏或正在被其他程序占用');
                addLog('文件读取失败', 'error');
            };

            reader.readAsArrayBuffer(file);
        }


        // 模拟URL分析
        async function analyzeUrl(url, index) {
            // 模拟网络请求延迟
            await new Promise(resolve => setTimeout(resolve, Math.random() * 1000 + 500));

            // 模拟提取数据
            const domain = extractDomain(url);
            let title = `${domain} - 网站标题`;
            let keywords = '';
            let description = `这是 ${domain} 的网站描述，提供各种服务...`;
            let h1 = '';
            let h2 = '';
            let h3 = '';


            let summary = generateSummary(url, keywords);
            let industry = classifyIndustry(url, keywords, title, description, industryKeywords);
            let risk = assessRisk(url, keywords, title, description, riskKeywords);

            try {
                const stream = await cursorMessageStream({
                    prompt: `请分析以下网站信息并返回JSON格式的分析结果：

网站URL: ${url}

请完成以下任务：
1. 访问并分析该网站的内容和特征，并且记录下网站头部信息的title，keywords和description
2. 根据提供的标题、关键词和描述，生成一句话的网站总结（100字以内）
3. 判断网站所属行业类别（从以下选项中选择最合适的一个）：电子商务、金融服务、科技/IT、教育培训、医疗健康、房地产、汽车、媒体/娱乐、社交网络、餐饮美食、旅游、企业服务、其他
4. 评估网站风险等级，判断是否涉及色情、赌博或其他灰色产业，风险等级分为：高风险、可疑、安全
5. 说明风险评估的具体原因
6. 帮我生成以下固定格式的json数据

**重要：请严格按照以下JSON格式，不要包含任何其他文字说明：**

{
  "summary": "对网站的总结描述（100字以内）",
  "industryKeywords": "所属行业分类",
  "risk": "风险等级（高风险/可疑/安全）",
  "why": "风险评估等级的原因说明"，
  "description": "网站描述"
  "keywords": "关键词"
  "title": "标题"
}`,
                });
 
                const result = await stream.wait(); // 阻塞

                const json = JSON.parse(result.code);
                summary = json.summary;
                industryKeywords = json.industryKeywords;
                risk = json.risk;
                why = json.why;
                description = json.description;
                keywords = json.keywords;
                title = json.title;
            } catch (e) {
                console.error('Error analyzing URL:', e);
            }

            try {
                if (keywords) {
                    return;
                }
                const result = await fetch('/api/url', {
                    method: 'POST',
                    body: JSON.stringify({
                        url,
                    }),
                })
                    .then((res) => res.json())

                title = result.title;
                keywords = result.keywords;
                description = result.description;
                h1 = result.h1?.join('|||') || '';
                h2 = result.h2?.join('|||') || '';
                h3 = result.h3?.join('|||') || '';
            } catch (error) {
                console.error('Error analyzing URL:', error);
            }


            return {
                index: index + 1,
                url,
                title,
                keywords,
                description,
                summary,
                industry,
                risk,
                status: 'completed',
                h1,
                h2,
                h3
            };
        }


        // 开始分析
        async function startAnalysis() {
            if (isAnalyzing) return;

            if (!sourceData || !sourceData.Sheet1 || sourceData.Sheet1.length === 0) {
                alert('⚠️ 请先上传包含URL数据的文件');
                addLog('无法开始分析：未加载数据', 'warning');
                return;
            }

            isAnalyzing = true;
            startTime = Date.now();

            document.getElementById('startBtn').disabled = true;

            const concurrent = parseInt(document.getElementById('concurrentInput').value) || 6;

            // 分析所有数据
            const urlColumn = sourceData.urlColumn || 'url';
            const urls = sourceData.Sheet1.map(item => item.url || item[urlColumn]);
            const total = urls.length;

            addLog(`开始分析全部数据，共 ${total} 个URL，并发数: ${concurrent}`, 'info');

            // 批量分析
            for (let i = 0; i < total; i += concurrent) {
                if (!isAnalyzing) break;

                const batch = urls.slice(i, i + concurrent);
                const promises = batch.map((url, idx) => analyzeUrl(url, i + idx));

                try {
                    const results = await Promise.all(promises);
                    analyzedResults.push(...results);

                    // 更新UI
                    updateStats();
                    updateProgress(analyzedResults.length, total);
                    updateTable();
                    updateChartsData();

                    addLog(`已完成 ${analyzedResults.length}/${total}`, 'success');
                } catch (error) {
                    console.error('Error analyzing URL:', error);
                    addLog(`批次分析出错: ${error.message}`, 'error');
                }
            }

            if (isAnalyzing) {
                addLog('✅ 全部分析完成！', 'success');
                isAnalyzing = false;
                document.getElementById('startBtn').disabled = false;
            }
        }

        // 更新统计
        function updateStats() {
            const total = analyzedResults.length;
            const riskCount = analyzedResults.filter(r => r.risk === '高风险').length;
            const safeCount = analyzedResults.filter(r => r.risk === '安全').length;

            document.getElementById('analyzedUrls').textContent = total;
            document.getElementById('riskUrls').textContent = riskCount;
            document.getElementById('safeUrls').textContent = safeCount;
        }

        // 更新进度
        function updateProgress(current, total) {
            const percentage = Math.round((current / total) * 100);
            const progressBar = document.getElementById('progressBar');
            progressBar.style.width = percentage + '%';
            progressBar.textContent = percentage + '%';

            const elapsed = (Date.now() - startTime) / 1000;
            const speed = (current / elapsed).toFixed(2);

            document.getElementById('progressText').textContent = `已分析 ${current}/${total} 个URL`;
            document.getElementById('speedText').textContent = `速度: ${speed} URL/s`;
        }

        // 更新表格
        function updateTable() {
            const tbody = document.getElementById('resultsTableBody');
            const lastResults = analyzedResults.slice(-10).reverse();

            tbody.innerHTML = lastResults.map(result => `
                <tr>
                    <td>${result.index}</td>
                    <td class="url-cell" title="${result.url}">${result.url}</td>
                    <td>${result.title}</td>
                    <td>${result.keywords}</td>
                    <td style="max-width: 200px; overflow: hidden; text-overflow: ellipsis;">${result.description}</td>
                    <td>${result.summary}</td>
                    <td><strong>${result.industry}</strong></td>
                    <td>
                        <span class="badge ${result.risk === '安全' ? 'badge-safe' : result.risk === '高风险' ? 'badge-risk' : 'badge-unknown'}">
                            ${result.risk}
                        </span>
                    </td>
                    <td>✅ 完成</td>
                </tr>
            `).join('');
        }

        // 更新图表数据
        function updateChartsData() {
            if (charts) {
                updateCharts(charts, analyzedResults);
            }
        }

        // 导出报告
        function exportReport() {
            if (analyzedResults.length === 0) {
                alert('暂无数据可导出');
                return;
            }

            const csv = convertToCSV(analyzedResults);
            downloadCSV(csv, 'url_analysis_report.csv');
            addLog('报告导出成功', 'success');
        }

        // 事件监听
        document.getElementById('uploadBtn').addEventListener('click', () => {
            document.getElementById('fileInput').click();
        });
        document.getElementById('fileInput').addEventListener('change', handleFileUpload);
        document.getElementById('startBtn').addEventListener('click', startAnalysis);
        document.getElementById('exportBtn').addEventListener('click', exportReport);

        // 页面加载完成后初始化
        window.addEventListener('load', init);
    </script>
</body>

</html>
