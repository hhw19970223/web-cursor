<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL批量分析系统 - 行业分类与风险评估</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 32px;
            font-weight: 700;
        }

        .subtitle {
            color: #666;
            font-size: 16px;
            margin-bottom: 20px;
        }

        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .stat-value {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 14px;
            opacity: 0.9;
        }

        .control-panel {
            background: white;
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        }

        .control-group {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .btn-success {
            background: #10b981;
            color: white;
        }

        .btn-danger {
            background: #ef4444;
            color: white;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .input-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        input[type="number"] {
            padding: 10px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            width: 150px;
        }

        select {
            padding: 8px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            background: white;
            transition: all 0.3s ease;
            outline: none;
        }

        select:hover {
            border-color: #667eea;
        }

        select:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        /* 复选框过滤器样式 */
        .filter-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-actions {
            display: flex;
            gap: 8px;
            margin-left: auto;
        }

        .filter-action-btn {
            padding: 6px 12px;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            font-size: 12px;
            background: white;
            cursor: pointer;
            transition: all 0.2s ease;
            color: #666;
        }

        .filter-action-btn:hover {
            background: #f9fafb;
            border-color: #667eea;
            color: #667eea;
        }

        .filter-checkbox {
            position: relative;
            display: inline-flex;
            align-items: center;
            cursor: pointer;
            user-select: none;
        }

        .filter-checkbox input[type="checkbox"] {
            position: absolute;
            opacity: 0;
            cursor: pointer;
            height: 0;
            width: 0;
        }

        .filter-checkbox-label {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            background: white;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .filter-checkbox:hover .filter-checkbox-label {
            border-color: #667eea;
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.15);
            transform: translateY(-1px);
        }

        .filter-checkbox input[type="checkbox"]:checked + .filter-checkbox-label {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-color: #667eea;
            color: white;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .filter-checkbox-icon {
            font-size: 16px;
        }

        /* 不同风险等级的颜色标识 */
        .filter-checkbox.risk-safe input[type="checkbox"]:checked + .filter-checkbox-label {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            border-color: #10b981;
        }

        .filter-checkbox.risk-suspicious input[type="checkbox"]:checked + .filter-checkbox-label {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            border-color: #f59e0b;
        }

        .filter-checkbox.risk-high input[type="checkbox"]:checked + .filter-checkbox-label {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            border-color: #ef4444;
        }

        .filter-checkbox.risk-unknown input[type="checkbox"]:checked + .filter-checkbox-label {
            background: linear-gradient(135deg, #6b7280 0%, #4b5563 100%);
            border-color: #6b7280;
        }

        .progress-section {
            background: white;
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        }

        .progress-bar-container {
            width: 100%;
            height: 30px;
            background: #f0f0f0;
            border-radius: 15px;
            overflow: hidden;
            margin-bottom: 15px;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 14px;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            color: #666;
        }

        .charts-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(1000px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .chart-card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        }

        .chart-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #333;
        }

        .chart-container {
            width: 100%;
            height: 400px;
        }

        .table-card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .table-container {
            overflow-x: auto;
            overflow-y: auto;
            max-height: 600px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
            min-width: 1200px;
        }

        thead {
            position: sticky;
            top: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            z-index: 10;
        }

        th {
            padding: 15px;
            text-align: left;
            font-weight: 600;
            white-space: nowrap;
        }

        td {
            padding: 12px 15px;
            border-bottom: 1px solid #f0f0f0;
            max-width: 250px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            line-height: 1.5;
            word-break: break-word;
            vertical-align: middle;
        }

        tbody tr:hover {
            background: #f8f9fa;
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .badge-safe {
            background: #d1fae5;
            color: #065f46;
        }

        .badge-risk {
            background: #fee2e2;
            color: #991b1b;
        }

        .badge-risk2 {
            background: #fef3c7;
            color: #92400e;
        }

        .badge-unknown {
            background: #e5e7eb;
            color: #374151;
        }

        .url-cell {
            max-width: 300px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .log-container {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 20px;
            border-radius: 10px;
            max-height: 300px;
            overflow-y: auto;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 13px;
            line-height: 1.6;
        }

        .log-entry {
            margin-bottom: 5px;
        }

        .log-info {
            color: #4ec9b0;
        }

        .log-success {
            color: #4caf50;
        }

        .log-warning {
            color: #ff9800;
        }

        .log-error {
            color: #f44336;
        }

        @media (max-width: 768px) {
            .charts-row {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 24px;
            }

            .stat-card {
                padding: 15px;
            }

            .stat-value {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- 头部 -->
        <div class="header">
            <h1>🔍 URL批量分析系统</h1>
            <p class="subtitle">智能分析网站行业分类与高风险产业识别</p>

            <div class="stats-row">
                <div class="stat-card">
                    <div class="stat-value" id="totalUrls">0</div>
                    <div class="stat-label">总URL数量</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="analyzedUrls">0</div>
                    <div class="stat-label">已分析</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="riskUrls">0</div>
                    <div class="stat-label">高风险</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="safeUrls">0</div>
                    <div class="stat-label">安全</div>
                </div>
            </div>
        </div>

        <!-- 文件上传面板 -->
        <div class="control-panel">
            <h3 style="margin-bottom: 20px;">📂 数据导入</h3>
            <div class="control-group">
                <input type="file" id="fileInput" accept=".xlsx,.xls,.csv" style="display: none;">
                <button class="btn btn-primary" id="uploadBtn">
                    <span>📤</span> 选择文件（Excel/CSV）
                </button>
                <span id="fileNameDisplay" style="color: #666; font-size: 14px;">未选择文件</span>
            </div>
            <div class="control-group" style="margin-top: 15px;">
                <input type="file" id="historyFileInput" accept=".xlsx,.xls,.csv" style="display: none;">
                <button class="btn btn-success" id="uploadHistoryBtn">
                    <span>📥</span> 导入历史分析结果
                </button>
                <span id="historyFileNameDisplay" style="color: #666; font-size: 14px;">未选择历史文件</span>
                <span id="historyCountDisplay" style="color: #10b981; font-size: 14px; font-weight: 600; margin-left: 10px;"></span>
            </div>
        </div>

        <!-- 控制面板 -->
        <div class="control-panel">
            <h3 style="margin-bottom: 20px;">⚙️ 控制面板</h3>
            <div class="control-group">
                <button class="btn btn-primary" id="startBtn" disabled>
                    <span>▶️</span> 开始分析（全部）
                </button>
                <button class="btn btn-success" id="exportBtn">
                    <span>📥</span> 导出分析数据
                </button>

                <!-- <div class="input-group">
                    <label>并发数:</label>
                    <input type="number" id="concurrentInput" value="6" min="1" max="20">
                </div> -->
            </div>
        </div>

        <!-- 进度条 -->
        <div class="progress-section">
            <h3 style="margin-bottom: 15px;">分析进度</h3>
            <div class="progress-bar-container">
                <div class="progress-bar" id="progressBar" style="width: 0%;">0%</div>
            </div>
            <div class="progress-info">
                <span id="progressText">等待开始...</span>
                <span id="speedText">速度: 0 URL/s</span>
            </div>

            <div class="log-container" id="logContainer" style="margin-top: 20px;">
                <div class="log-entry log-info">系统就绪，等待开始分析...</div>
            </div>
        </div>

        <!-- 图表展示 -->
        <div class="charts-row">
            <div class="chart-card">
                <div style="display: flex; flex-direction: column; gap: 15px; margin-bottom: 20px;">
                    <div class="chart-title" style="margin-bottom: 0;">📊 行业分类分布</div>
                    <div class="filter-group">
                        <label class="filter-checkbox risk-safe">
                            <input type="checkbox" class="industry-risk-filter" value="安全" checked>
                            <span class="filter-checkbox-label">
                                <span class="filter-checkbox-icon">✅</span>
                                <span>安全</span>
                            </span>
                        </label>
                        <label class="filter-checkbox risk-suspicious">
                            <input type="checkbox" class="industry-risk-filter" value="可疑" checked>
                            <span class="filter-checkbox-label">
                                <span class="filter-checkbox-icon">⚠️</span>
                                <span>可疑</span>
                            </span>
                        </label>
                        <label class="filter-checkbox risk-high">
                            <input type="checkbox" class="industry-risk-filter" value="高风险" checked>
                            <span class="filter-checkbox-label">
                                <span class="filter-checkbox-icon">🚫</span>
                                <span>高风险</span>
                            </span>
                        </label>
                        <label class="filter-checkbox risk-unknown">
                            <input type="checkbox" class="industry-risk-filter" value="未知" checked>
                            <span class="filter-checkbox-label">
                                <span class="filter-checkbox-icon">❓</span>
                                <span>未知</span>
                            </span>
                        </label>
                        <div class="filter-actions">
                            <button class="filter-action-btn" id="selectAllRisks">全选</button>
                            <button class="filter-action-btn" id="deselectAllRisks">清空</button>
                        </div>
                    </div>
                </div>
                <div class="chart-container" id="industryChart"></div>
            </div>
            <div class="chart-card">
                <div class="chart-title">⚠️ 风险等级分布</div>
                <div class="chart-container" id="riskChart"></div>
            </div>
        </div>

        <!-- 数据表格 -->
        <div class="table-card">
            <h3 style="margin-bottom: 20px;">📋 分析结果详情</h3>
            <div class="table-container">
                <table id="resultsTable">
                    <thead>
                        <tr>
                            <!-- <th>序号</th> -->
                            <th>URL</th>
                            <th>数量</th>
                            <th>网站摘要</th>
                            <th>行业分类</th>
                            <th>风险评估</th>
                            <th>风险原因</th>
                            <th>状态</th>
                            <th>标题</th>
                            <th>关键词</th>
                            <th>描述</th>
                        </tr>
                    </thead>
                    <tbody id="resultsTableBody">
                        <tr>
                            <td colspan="11" style="text-align: center; padding: 30px; color: #999;">
                                暂无数据，请点击"开始分析"按钮
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/echarts@latest/dist/echarts.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="../common.js"></script>
    <script src="./index.js"></script>
    <script>
        // 全局变量
        let sourceData = null;
        let analyzedResults = [];
        let historyResults = new Map(); // 存储历史分析结果，key为URL，value为分析数据
        let isAnalyzing = false;
        let currentIndex = 0;
        let startTime = 0;
        let charts = null; // 图表实例

        // 行业关键词映射
        const industryKeywords = {
            '电子商务': ['shop', 'store', 'buy', 'sell', 'cart', 'product', 'ecommerce', 'shopping', '商城', '购物', '电商'],
            '金融服务': ['bank', 'finance', 'loan', 'credit', 'payment', 'invest', 'trading', '金融', '银行', '贷款', '投资'],
            '科技/IT': ['tech', 'software', 'app', 'code', 'dev', 'api', 'cloud', 'ai', '科技', '软件', '开发'],
            '教育培训': ['education', 'learn', 'course', 'training', 'school', 'university', '教育', '培训', '学习', '课程'],
            '医疗健康': ['health', 'medical', 'hospital', 'doctor', 'medicine', 'clinic', '医疗', '健康', '医院'],
            '房地产': ['real estate', 'property', 'house', 'rent', 'apartment', 'zillow', '房产', '租房', '地产'],
            '汽车': ['car', 'auto', 'vehicle', 'motor', 'lease', 'automotive', '汽车', '车辆'],
            '媒体/娱乐': ['media', 'news', 'blog', 'video', 'music', 'game', 'entertainment', '媒体', '娱乐', '游戏'],
            '社交网络': ['social', 'community', 'forum', 'reddit', 'facebook', 'twitter', '社交', '论坛'],
            '餐饮美食': ['food', 'restaurant', 'delivery', 'menu', 'dining', 'swiggy', '餐饮', '美食'],
            '旅游': ['travel', 'hotel', 'booking', 'tourism', 'vacation', '旅游', '酒店'],
            '企业服务': ['business', 'enterprise', 'service', 'management', 'hr', 'crm', '企业', '管理'],
        };

        // 高风险关键词
        const riskKeywords = [
            'casino', 'gambling', 'bet', 'porn', 'adult', 'xxx',
            'drugs', 'loan shark', 'scam', 'hack', 'crack',
            '博彩', '赌博', '色情', '成人', '高利贷', '诈骗', '黑客'
        ];

        // 初始化
        async function init() {
            addLog('系统就绪，请上传Excel或CSV文件', 'info');
            charts = initCharts();
        }

        // 处理文件上传
        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            // 显示文件名
            document.getElementById('fileNameDisplay').textContent = `已选择: ${file.name}`;
            addLog(`正在解析文件: ${file.name}`, 'info');

            const reader = new FileReader();

            reader.onload = function (e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });

                    // 获取第一个工作表
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];

                    // 转换为JSON
                    const jsonData = XLSX.utils.sheet_to_json(worksheet);

                    if (!jsonData || jsonData.length === 0) {
                        showError('文件解析失败：文件为空或格式不正确');
                        addLog('解析失败：文件内容为空', 'error');
                        return;
                    }

                    // 查找URL列
                    const urlColumn = findUrlColumn(jsonData[0]);

                    if (!urlColumn) {
                        showError('文件解析失败：未找到URL列\n请确保文件中包含URL相关的列（如：url、网址、链接、提取页面url等）');
                        addLog('解析失败：未找到URL列', 'error');
                        return;
                    }

                    // 提取URL并验证
                    const urlMap = new Map(); // 用于合并相同URL
                    let emptyCount = 0;
                    let totalRowCount = 0;

                    jsonData.forEach((row, index) => {
                        const url = row[urlColumn];
                        if (url && String(url).trim()) {
                            totalRowCount++;
                            const trimmedUrl = String(url).trim();

                            // 如果URL已存在，增加计数；否则添加新URL
                            if (urlMap.has(trimmedUrl)) {
                                const existing = urlMap.get(trimmedUrl);
                                existing.count += 1;
                            } else {
                                urlMap.set(trimmedUrl, {
                                    ...row,
                                    url: trimmedUrl,
                                    count: 1
                                });
                            }
                        } else {
                            emptyCount++;
                        }
                    });

                    if (urlMap.size === 0) {
                        showError('文件解析失败：所有URL均为空\n请检查文件中是否包含有效的URL数据');
                        addLog('解析失败：没有有效的URL数据', 'error');
                        return;
                    }

                    // 转换为数组
                    const urls = Array.from(urlMap.values());

                    // 保存数据
                    sourceData = { Sheet1: urls, urlColumn };

                    // 更新统计
                    const uniqueCount = urls.length;
                    const duplicateCount = totalRowCount - uniqueCount;
                    document.getElementById('totalUrls').textContent = uniqueCount.toLocaleString();

                    // 启用开始按钮
                    document.getElementById('startBtn').disabled = false;

                    // 显示成功信息
                    let logMessage = `文件解析成功！共 ${totalRowCount} 条URL记录，去重后 ${uniqueCount} 条唯一URL`;
                    if (duplicateCount > 0) {
                        logMessage += `（合并了 ${duplicateCount} 条重复URL）`;
                        addLog(`警告：发现 ${duplicateCount} 条重复URL已被合并`, 'warning');
                    }
                    if (emptyCount > 0) {
                        logMessage += `（跳过 ${emptyCount} 条空记录）`;
                        addLog(`警告：发现 ${emptyCount} 条空URL记录已被跳过`, 'warning');
                    }
                    addLog(logMessage, 'success');
                    addLog(`URL列名: ${urlColumn}`, 'info');

                } catch (error) {
                    showError('文件解析失败：' + error.message + '\n请确保文件格式正确（支持.xlsx、.xls、.csv格式）');
                    addLog(`解析错误: ${error.message}`, 'error');
                    console.error('File parse error:', error);
                }
            };

            reader.onerror = function () {
                showError('文件读取失败：无法读取文件\n请检查文件是否损坏或正在被其他程序占用');
                addLog('文件读取失败', 'error');
            };

            reader.readAsArrayBuffer(file);
        }

        // 处理历史文件上传
        function handleHistoryFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            // 显示文件名
            document.getElementById('historyFileNameDisplay').textContent = `已选择: ${file.name}`;
            addLog(`正在解析历史分析文件: ${file.name}`, 'info');

            const reader = new FileReader();

            reader.onload = function (e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });

                    // 获取第一个工作表
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];

                    // 转换为JSON
                    const jsonData = XLSX.utils.sheet_to_json(worksheet);

                    if (!jsonData || jsonData.length === 0) {
                        showError('历史文件解析失败：文件为空或格式不正确', 'history');
                        addLog('历史文件解析失败：文件内容为空', 'error');
                        return;
                    }

                    // 查找URL列
                    const urlColumn = findUrlColumn(jsonData[0]);

                    if (!urlColumn) {
                        showError('历史文件解析失败：未找到URL列', 'history');
                        addLog('历史文件解析失败：未找到URL列', 'error');
                        return;
                    }

                    // 提取历史分析结果，过滤掉status为"未知"或risk为"未知"的数据
                    let importedCount = 0;
                    let filteredCount = 0;

                    jsonData.forEach((row) => {
                        const url = row[urlColumn] || row['URL'];
                        const risk = row['风险评估'] || row['risk'] || '';
                        const status = row['状态'] || row['status'] || '';

                        // 过滤掉status为"未知"或risk为"未知"的数据
                        if (risk === '未知' || status === '未知' || risk.includes('未知')) {
                            filteredCount++;
                            return;
                        }

                        if (url && String(url).trim()) {
                            const trimmedUrl = String(url).trim();
                            
                            // 保存历史分析结果
                            historyResults.set(trimmedUrl, {
                                url: trimmedUrl,
                                count: row['数量'] || row['count'] || 1,
                                title: row['标题'] || row['title'] || '',
                                keywords: row['关键词'] || row['keywords'] || '',
                                description: row['描述'] || row['description'] || '',
                                summary: row['网站摘要'] || row['summary'] || '',
                                industry: row['行业分类'] || row['industry'] || '其他',
                                risk: risk,
                                why: row['风险原因'] || row['为什么'] || row['why'] || '',
                                status: 'completed',
                                h1: row['h1'] || '',
                                h2: row['h2'] || '',
                                h3: row['h3'] || ''
                            });
                            importedCount++;
                        }
                    });

                    if (historyResults.size === 0) {
                        showError('历史文件导入失败：没有有效的历史数据\n（已过滤掉所有status为"未知"的记录）', 'history');
                        addLog('历史文件导入失败：没有有效的历史数据', 'error');
                        return;
                    }

                    // 显示成功信息
                    let logMessage = `历史文件导入成功！共导入 ${importedCount} 条有效历史记录`;
                    if (filteredCount > 0) {
                        logMessage += `（已过滤 ${filteredCount} 条status为"未知"的记录）`;
                    }
                    addLog(logMessage, 'success');
                    addLog(`历史记录将在分析时自动使用，跳过重复分析`, 'info');

                    // 更新显示
                    document.getElementById('historyCountDisplay').textContent = `✅ 已导入 ${historyResults.size} 条历史记录`;

                    // 将历史数据添加到analyzedResults进行展示
                    let index = analyzedResults.length;
                    for (const [url, historyData] of historyResults.entries()) {
                        // 检查是否已经存在于analyzedResults中（避免重复）
                        const existingIndex = analyzedResults.findIndex(r => r.url === url);
                        if (existingIndex === -1) {
                            analyzedResults.push({
                                index: index + 1,
                                url: url,
                                count: historyData.count || 1,
                                title: historyData.title || '',
                                keywords: historyData.keywords || '',
                                description: historyData.description || '',
                                summary: historyData.summary || '',
                                industry: historyData.industry || '其他',
                                risk: historyData.risk || '未知',
                                why: historyData.why || '',
                                status: 'completed',
                                h1: historyData.h1 || '',
                                h2: historyData.h2 || '',
                                h3: historyData.h3 || ''
                            });
                            index++;
                        }
                    }

                    // 更新UI显示
                    updateStats();
                    updateTable();
                    updateChartsData();
                    
                    // 更新总URL数量统计
                    const currentTotal = parseInt(document.getElementById('totalUrls').textContent.replace(/,/g, '')) || 0;
                    const newTotal = Math.max(currentTotal, analyzedResults.length);
                    document.getElementById('totalUrls').textContent = newTotal.toLocaleString();
                    
                    addLog(`已将 ${historyResults.size} 条历史记录加载到分析结果中`, 'success');

                } catch (error) {
                    showError('历史文件解析失败：' + error.message, 'history');
                    addLog(`历史文件解析错误: ${error.message}`, 'error');
                    console.error('History file parse error:', error);
                }
            };

            reader.onerror = function () {
                showError('历史文件读取失败：无法读取文件', 'history');
                addLog('历史文件读取失败', 'error');
            };

            reader.readAsArrayBuffer(file);
        }

        // 清空历史记录
        function clearHistoryRecords() {
            if (!historyResults || historyResults.size === 0) {
                addLog('没有历史记录需要清空', 'warning');
                return;
            }

            const count = historyResults.size;
            
            // 确认清空
            if (!confirm(`确定要清空 ${count} 条历史记录吗？\n\n注意：这不会影响当前已分析的结果，只会清空历史记录缓存。`)) {
                return;
            }

            // 清空历史记录
            historyResults.clear();
            
            // 更新UI
            document.getElementById('historyFileNameDisplay').textContent = '未选择历史文件';
            document.getElementById('historyCountDisplay').textContent = '';
            document.getElementById('historyFileInput').value = '';
            
            addLog(`已清空 ${count} 条历史记录`, 'success');
        }



        // URLS分析
        async function analyzeUrl(urls) {

            try {
                const accessToken = urlParams.get('accessToken') || '';
                // 调用后端 API 进行分析
                const response = await fetch('/api/url-analyzer', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        urls,  // 传入URL数组
                        accessToken
                    })
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const result = await response.json();
                return result;

            } catch (error) {
                console.error('analyzeUrl error:', error);
                throw error;
            }
        }

        // 从历史记录中获取URL分析结果
        function getHistoryResult(url) {
            return historyResults.get(url);
        }

        // 开始分析
        async function startAnalysis() {
            if (isAnalyzing) return;

            const accessToken = urlParams.get('accessToken') || '';

            if (!accessToken) {
                alert('accessToken 参数是必需的');
                throw new Error('accessToken 参数是必需的，请在 URL 中添加 ?accessToken=你的token');
            }

            if (!sourceData || !sourceData.Sheet1 || sourceData.Sheet1.length === 0) {
                alert('⚠️ 请先上传包含URL数据的文件');
                addLog('无法开始分析：未加载数据', 'warning');
                return;
            }

            isAnalyzing = true;
            startTime = Date.now();

            document.getElementById('startBtn').disabled = true;

            const concurrent = 6;

            // 分析所有数据
            const urlColumn = sourceData.urlColumn || 'url';
            const urlData = sourceData.Sheet1; // 保留完整数据对象，包含count字段
            const total = urlData.length;
            analyzedResults.length = 0;
            

            // 批量更新UI
            updateStats();
            updateProgress(analyzedResults.length, total);
            updateTable();
            updateChartsData();

            addLog(`开始分析全部数据，共 ${total} 个唯一URL，并发数: ${concurrent}`, 'info');


            // 将URL按50个一组分批
            const BATCH_SIZE = 5;
            const batches = [];

            for (let i = 0; i < urlData.length; i += BATCH_SIZE) {
                const batchData = urlData.slice(i, i + BATCH_SIZE);
                batches.push({
                    startIndex: i,
                    data: batchData
                });
            }

            addLog(`已分为 ${batches.length} 批次，每批最多 ${BATCH_SIZE} 个URL`, 'info');

            // 使用队列方式分析每个批次
            const taskQueue = new TaskQueue(concurrent);

            // 将所有批次添加到队列
            for (const batch of batches) {
                if (!isAnalyzing) break;

                // 添加批次任务到队列（不等待）
                taskQueue.add(async () => {
                    // 检查哪些URL在历史记录中
                    const urlsToAnalyze = [];
                    const historyUrls = [];

                    for (const item of batch.data) {
                        const url = item.url || item[urlColumn];
                        const historyResult = getHistoryResult(url);
                        
                        if (historyResult) {
                            // 使用历史记录
                            historyUrls.push({
                                url: url,
                                item: item,
                                historyData: historyResult
                            });
                        } else {
                            // 需要分析
                            urlsToAnalyze.push({
                                url: url,
                                item: item
                            });
                        }
                    }

                    // 处理历史记录中的URL
                    if (historyUrls.length > 0) {
                        addLog(`从历史记录中加载 ${historyUrls.length} 个URL`, 'info');
                        
                        for (const {url, item, historyData} of historyUrls) {
                            const index = batch.startIndex + batch.data.indexOf(item);
                            const count = item.count || 1;

                            analyzedResults.push({
                                index: index + 1,
                                url,
                                count,
                                title: historyData.title,
                                keywords: historyData.keywords,
                                description: historyData.description,
                                summary: historyData.summary,
                                industry: historyData.industry,
                                risk: historyData.risk,
                                why: historyData.why,
                                status: 'completed'
                            });
                        }
                    }

                    // 如果有需要分析的URL
                    if (urlsToAnalyze.length > 0) {
                        const urls = urlsToAnalyze.map(item => item.url);

                        addLog(`正在分析批次: ${batch.startIndex + 1} - ${batch.startIndex + batch.data.length}（新分析 ${urlsToAnalyze.length} 个，历史记录 ${historyUrls.length} 个）`, 'info');

                        try {
                            // 调用API分析这一批URL
                            let result = await analyzeUrl(urls);

                            // 检查返回结果
                            if (!result.success || !result.data) {
                                result = await analyzeUrl(urls);//再试一次
                                if (!result.success || !result.data) {
                                    throw new Error('API返回数据格式错误');
                                    result = await analyzeUrl(urls);//再试一次
                                }
                            }

                            // 处理每个URL的结果
                            for (const {url, item} of urlsToAnalyze) {
                                const count = item.count || 1;
                                const index = batch.startIndex + batch.data.indexOf(item);

                                const data = result.data[url];

                                let urlResult;
                                if (!data || data.error) {
                                    // 处理错误情况
                                    urlResult = {
                                        index: index + 1,
                                        url,
                                        count,
                                        title: '',
                                        keywords: '',
                                        description: '',
                                        summary: '',
                                        industry: '未知',
                                        risk: '未知',
                                        why: data?.error || '未知错误',
                                        status: '分析失败'
                                    };
                                } else {
                                    // 处理成功情况
                                    urlResult = {
                                        index: index + 1,
                                        url,
                                        count,
                                        title: data.title || '',
                                        keywords: data.keywords || '',
                                        description: data.description || '',
                                        summary: data.summary || '',
                                        industry: data.industry || '其他',
                                        risk: data.risk || '未知',
                                        why: data.why || '',
                                        status: 'completed'
                                    };
                                }

                                analyzedResults.push(urlResult);
                            }

                        } catch (error) {
                            console.error('批次分析出错:', error);
                            addLog(`批次分析失败 (${batch.startIndex + 1} - ${batch.startIndex + batch.data.length}): ${error.message}`, 'error');

                            // 即使失败也要记录错误结果
                            for (const {url, item} of urlsToAnalyze) {
                                const count = item.count || 1;
                                const index = batch.startIndex + batch.data.indexOf(item);

                                analyzedResults.push({
                                    index: index + 1,
                                    url,
                                    count,
                                    title: '',
                                    keywords: '',
                                    description: '',
                                    summary: '批次分析失败',
                                    industry: '未知',
                                    risk: '未知',
                                    why: error.message,
                                    status: 'error'
                                });
                            }
                        }
                    } else {
                        // 全部从历史记录获取，不需要API分析
                        addLog(`批次完成（全部来自历史记录）: ${batch.startIndex + 1} - ${batch.startIndex + batch.data.length}`, 'success');
                    }

                    // 批量更新UI
                    updateStats();
                    updateProgress(analyzedResults.length, total);
                    updateTable();
                    updateChartsData();

                    if (urlsToAnalyze.length > 0) {
                        addLog(`批次完成: ${batch.startIndex + 1} - ${batch.startIndex + batch.data.length}，总进度 ${analyzedResults.length}/${total}`, 'success');
                    }

                    return batch.data.length;

                }).catch(error => {
                    console.error('Error in batch task:', error);
                });
            }

            // 等待所有任务完成
            try {
                await taskQueue.waitAll();
                addLog(`队列执行完成 ${analyzedResults.length}/${total}`, 'success');
            } catch (error) {
                console.error('Queue execution error:', error);
                addLog(`队列执行出错: ${error.message}`, 'error');
            }

            if (isAnalyzing) {
                addLog('✅ 全部分析完成！', 'success');
                isAnalyzing = false;
                document.getElementById('startBtn').disabled = false;
            }
        }

        // 更新统计
        function updateStats() {
            const total = analyzedResults.length;
            const riskCount = analyzedResults.filter(r => r?.risk === '高风险').length;
            const safeCount = analyzedResults.filter(r => r?.risk === '安全').length;

            document.getElementById('analyzedUrls').textContent = total;
            document.getElementById('riskUrls').textContent = riskCount;
            document.getElementById('safeUrls').textContent = safeCount;
        }

        // 更新进度
        function updateProgress(current, total) {
            const percentage = Math.round((current / total) * 100);
            const progressBar = document.getElementById('progressBar');
            progressBar.style.width = percentage + '%';
            progressBar.textContent = percentage + '%';

            const elapsed = (Date.now() - startTime) / 1000;
            const speed = (current / elapsed).toFixed(2);

            document.getElementById('progressText').textContent = `已分析 ${current}/${total} 个URL`;
            document.getElementById('speedText').textContent = `速度: ${speed} URL/s`;
        }

        // 更新表格
        function updateTable() {
            const tbody = document.getElementById('resultsTableBody');

            // 定义风险等级的排序优先级（数字越小优先级越高）
            const riskPriority = {
                '高风险': 1,
                '可疑': 2,
                '未知': 3,
                '安全': 4
            };

            // 过滤并排序：先过滤掉安全，然后按风险等级排序
            const filteredAndSorted = analyzedResults
                .filter(r => r?.risk !== '安全')
                .sort((a, b) => {
                    // 按风险等级排序
                    const priorityA = riskPriority[a.risk] || 999;
                    const priorityB = riskPriority[b.risk] || 999;
                    return priorityA - priorityB;
                });

            tbody.innerHTML = filteredAndSorted.map(result => `
                <tr>
                    <td style="min-width: 150px;" title="${result.url}">${result.url}</td>
                    <td style="min-width: 60px; text-align: center;"><strong>${result.count || 1}</strong></td>
                    
                    <td title="${result.summary}">${result.summary}</td>
                    <td style="min-width: 100px;"><strong>${result.industry}</strong></td>
                    <td style="min-width: 80px;">
                        <span class="badge ${result.risk === '安全' ? 'badge-safe' : result.risk === '高风险' ? 'badge-risk' : result.risk === '可疑' ? 'badge-risk2' : 'badge-unknown'}">
                            ${result.risk}
                        </span>
                    </td>
                    <td style="min-width: 150px;" title="${result.why || '无风险或未检测到风险特征'}">${result.why || '无风险或未检测到风险特征'}</td>
                    <td style="min-width: 80px;">${result.status === 'completed' ? '✅ 完成' : '⏳ 分析失败'}</td>
                    <td style="min-width: 100px;" title="${result.title}">${result.title}</td>
                    <td style="min-width: 100px;" title="${result.keywords}">${result.keywords}</td>
                    <td style="min-width: 100px;" title="${result.description}">${result.description}</td>
                </tr>
            `).join('');
        }

        // 更新图表数据
        function updateChartsData() {
            if (charts) {
                // 获取所有选中的风险等级
                const selectedRisks = Array.from(
                    document.querySelectorAll('.industry-risk-filter:checked')
                ).map(checkbox => checkbox.value);
                
                updateCharts(charts, analyzedResults, selectedRisks);
            }
        }

        // 导出报告
        function exportReport() {
            if (analyzedResults.length === 0) {
                alert('暂无数据可导出');
                return;
            }

            exportToExcel(analyzedResults, 'url_analysis_report.xlsx');
            addLog('Excel报告导出成功', 'success');
        }

        // 事件监听
        document.getElementById('uploadBtn').addEventListener('click', () => {
            document.getElementById('fileInput').click();
        });
        document.getElementById('fileInput').addEventListener('change', handleFileUpload);
        document.getElementById('uploadHistoryBtn').addEventListener('click', () => {
            document.getElementById('historyFileInput').click();
        });
        document.getElementById('historyFileInput').addEventListener('change', handleHistoryFileUpload);
        document.getElementById('startBtn').addEventListener('click', startAnalysis);
        document.getElementById('exportBtn').addEventListener('click', exportReport);
        
        // 行业分布过滤器事件监听（复选框）
        document.querySelectorAll('.industry-risk-filter').forEach(checkbox => {
            checkbox.addEventListener('change', (e) => {
                const selectedRisks = Array.from(
                    document.querySelectorAll('.industry-risk-filter:checked')
                ).map(cb => cb.value);
                
                if (selectedRisks.length === 0) {
                    // 如果全部取消选中，显示提示并自动选中当前点击的
                    e.target.checked = true;
                    addLog('至少需要选择一个风险等级', 'warning');
                    return;
                }
                
                const riskText = selectedRisks.join('、');
                addLog(`行业分布过滤: ${riskText}`, 'info');
                updateChartsData();
            });
        });

        // 全选按钮
        document.getElementById('selectAllRisks').addEventListener('click', () => {
            document.querySelectorAll('.industry-risk-filter').forEach(checkbox => {
                checkbox.checked = true;
            });
            addLog('行业分布过滤: 全部选中', 'info');
            updateChartsData();
        });

        // 清空按钮
        document.getElementById('deselectAllRisks').addEventListener('click', () => {
            const checkboxes = document.querySelectorAll('.industry-risk-filter');
            let checkedCount = 0;
            checkboxes.forEach(checkbox => {
                if (checkbox.checked) checkedCount++;
            });
            
            if (checkedCount === 0) {
                addLog('已经全部清空', 'info');
                return;
            }
            
            checkboxes.forEach(checkbox => {
                checkbox.checked = false;
            });
            // 至少保留一个选中，默认选中安全
            checkboxes[0].checked = true;
            addLog('行业分布过滤: 仅显示安全', 'info');
            updateChartsData();
        });

        // 页面加载完成后初始化
        window.addEventListener('load', init);
    </script>
</body>
