    <script>
        (function() {
            let isSelecting = false;
            let startX = 0;
            let startY = 0;
            let selectionBox = document.getElementById('selectionBox');
            let selectedElements = new Set();
            
            // 监听 Ctrl 键按下
            document.addEventListener('keydown', function(e) {
                if (e.ctrlKey && !isSelecting) {
                    document.body.style.cursor = 'crosshair';
                    document.body.style.userSelect = 'none';
                }
            });
            
            // 监听 Ctrl 键释放
            document.addEventListener('keyup', function(e) {
                if (!e.ctrlKey && !isSelecting) {
                    document.body.style.cursor = '';
                    document.body.style.userSelect = '';
                }
            });
            
            // 鼠标按下事件
            document.addEventListener('mousedown', function(e) {
                if (e.ctrlKey) {
                    e.preventDefault();
                    isSelecting = true;
                    startX = e.clientX;
                    startY = e.clientY;
                    
                    selectionBox.style.left = startX + 'px';
                    selectionBox.style.top = startY + 'px';
                    selectionBox.style.width = '0px';
                    selectionBox.style.height = '0px';
                    selectionBox.style.display = 'block';
                    
                    // 清除之前的选中状态
                    clearSelection();
                }
            });
            
            // 鼠标移动事件
            document.addEventListener('mousemove', function(e) {
                if (isSelecting) {
                    const currentX = e.clientX;
                    const currentY = e.clientY;
                    
                    const left = Math.min(startX, currentX);
                    const top = Math.min(startY, currentY);
                    const width = Math.abs(currentX - startX);
                    const height = Math.abs(currentY - startY);
                    
                    selectionBox.style.left = left + 'px';
                    selectionBox.style.top = top + 'px';
                    selectionBox.style.width = width + 'px';
                    selectionBox.style.height = height + 'px';
                    
                    // 更新选中的元素
                    updateSelection(left, top, width, height);
                }
            });
            
            // 鼠标释放事件
            document.addEventListener('mouseup', function(e) {
                if (isSelecting) {
                    isSelecting = false;
                    selectionBox.style.display = 'none';
                    document.body.style.cursor = '';
                    document.body.style.userSelect = '';
                    
                    // 输出选中的元素信息
                    if (selectedElements.size > 0) {
                        console.log('选中的元素数量:', selectedElements.size);
                        selectedElements.forEach(el => {
                            console.log('选中元素:', el);
                        });
                    }
                }
            });
            
            // 更新选中的元素
            function updateSelection(left, top, width, height) {
                clearSelection();
                selectedElements.clear();
                
                // 获取所有可选择的元素（排除选择框本身和 body）
                const allElements = document.querySelectorAll('*:not(#selectionBox):not(body):not(html)');
                
                allElements.forEach(element => {
                    const rect = element.getBoundingClientRect();
                    
                    // 检查元素是否满足选择条件：宽度或高度完全在选择框内，并且有重合
                    if (isOverlapping(left, top, width, height, rect.left, rect.top, rect.width, rect.height)) {
                        selectedElements.add(element);
                        element.style.outline = '2px solid #00d9a3';
                        element.style.outlineOffset = '2px';
                        element.style.backgroundColor = element.style.backgroundColor || '';
                        element.style.backgroundColor = 'rgba(0, 217, 163, 0.2)';
                    }
                });
            }
            
            // 检查元素是否满足选择条件：宽度或高度完全在选择框内，并且有重合
            function isOverlapping(x1, y1, w1, h1, x2, y2, w2, h2) {
                // 选择框的边界
                const selectionLeft = x1;
                const selectionRight = x1 + w1;
                const selectionTop = y1;
                const selectionBottom = y1 + h1;
                
                // 元素的边界
                const elementLeft = x2;
                const elementRight = x2 + w2;
                const elementTop = y2;
                const elementBottom = y2 + h2;
                
                // 检查宽度是否完全在选择框内
                const widthFullyInside = elementLeft >= selectionLeft && elementRight <= selectionRight;
                
                // 检查高度是否完全在选择框内
                const heightFullyInside = elementTop >= selectionTop && elementBottom <= selectionBottom;
                
                // 检查两个矩形是否有重叠（在X轴和Y轴都有重叠）
                const hasOverlapX = !(selectionRight < elementLeft || elementRight < selectionLeft);
                const hasOverlapY = !(selectionBottom < elementTop || elementBottom < selectionTop);
                const hasOverlap = hasOverlapX && hasOverlapY;
                
                // 宽度完全在区域内并且有重合，或者高度完全在区域内并且有重合
                return (widthFullyInside && hasOverlap) || (heightFullyInside && hasOverlap);
            }
            
            // 清除选中状态
            function clearSelection() {
                selectedElements.forEach(element => {
                    element.style.outline = '';
                    element.style.outlineOffset = '';
                    element.style.backgroundColor = '';
                });
                selectedElements.clear();
            }
            
            // 防止 Ctrl+拖拽时触发文本选择
            document.addEventListener('selectstart', function(e) {
                if (isSelecting || (e.ctrlKey && e.button === 0)) {
                    e.preventDefault();
                }
            });
        })();
    </script>
    
    <!-- @mention 功能 -->
    <script>
        (function() {
            const textarea = document.getElementById('mentionTextarea');
            const mentionPanel = document.getElementById('mentionPanel');
            const mentionList = document.getElementById('mentionList');
            
            // 示例用户列表（可以替换为实际数据）
            const users = [
                { id: 1, name: '张三', avatar: '👤' },
                { id: 2, name: '李四', avatar: '👨' },
                { id: 3, name: '王五', avatar: '👩' },
                { id: 4, name: '赵六', avatar: '🧑' },
                { id: 5, name: '钱七', avatar: '👧' },
                { id: 6, name: '孙八', avatar: '👦' },
                { id: 7, name: '周九', avatar: '🧒' },
                { id: 8, name: '吴十', avatar: '👶' }
            ];
            
            let currentMentionIndex = -1;
            let mentionStartPos = -1;
            let filteredUsers = [];
            
            // 监听输入事件
            textarea.addEventListener('input', function(e) {
                const value = textarea.value;
                const cursorPos = textarea.selectionStart;
                
                // 查找光标前的 @ 符号
                const textBeforeCursor = value.substring(0, cursorPos);
                const lastAtIndex = textBeforeCursor.lastIndexOf('@');
                
                if (lastAtIndex !== -1) {
                    // 检查 @ 后面是否有空格或换行，如果有则关闭面板
                    const textAfterAt = textBeforeCursor.substring(lastAtIndex + 1);
                    if (textAfterAt.includes(' ') || textAfterAt.includes('\n')) {
                        hideMentionPanel();
                        return;
                    }
                    
                    // 获取 @ 后的搜索关键词
                    const searchTerm = textAfterAt.toLowerCase();
                    mentionStartPos = lastAtIndex;
                    
                    // 过滤用户列表
                    filteredUsers = users.filter(user => 
                        user.name.toLowerCase().includes(searchTerm)
                    );
                    
                    if (filteredUsers.length > 0) {
                        showMentionPanel();
                        renderMentionList();
                        currentMentionIndex = -1;
                    } else {
                        hideMentionPanel();
                    }
                } else {
                    hideMentionPanel();
                }
            });
            
            // 监听键盘事件
            textarea.addEventListener('keydown', function(e) {
                if (mentionPanel.style.display === 'none') return;
                
                if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    currentMentionIndex = (currentMentionIndex + 1) % filteredUsers.length;
                    updateMentionListHighlight();
                } else if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    currentMentionIndex = currentMentionIndex <= 0 ? filteredUsers.length - 1 : currentMentionIndex - 1;
                    updateMentionListHighlight();
                } else if (e.key === 'Enter' || e.key === 'Tab') {
                    e.preventDefault();
                    if (currentMentionIndex >= 0 && currentMentionIndex < filteredUsers.length) {
                        selectMention(filteredUsers[currentMentionIndex]);
                    }
                } else if (e.key === 'Escape') {
                    e.preventDefault();
                    hideMentionPanel();
                }
            });
            
            // 显示提及面板
            function showMentionPanel() {
                mentionPanel.style.display = 'block';
            }
            
            // 隐藏提及面板
            function hideMentionPanel() {
                mentionPanel.style.display = 'none';
                currentMentionIndex = -1;
                mentionStartPos = -1;
            }
            
            // 渲染提及列表
            function renderMentionList() {
                mentionList.innerHTML = '';
                
                filteredUsers.forEach((user, index) => {
                    const item = document.createElement('div');
                    item.className = 'mention-item';
                    item.style.cssText = 'padding: 10px 16px; cursor: pointer; display: flex; align-items: center; gap: 10px; transition: background-color 0.2s;';
                    item.innerHTML = `
                        <span style="font-size: 20px;">${user.avatar}</span>
                        <span style="font-size: 14px; color: #333;">${user.name}</span>
                    `;
                    
                    item.addEventListener('mouseenter', function() {
                        currentMentionIndex = index;
                        updateMentionListHighlight();
                    });
                    
                    item.addEventListener('click', function() {
                        selectMention(user);
                    });
                    
                    mentionList.appendChild(item);
                });
                
                updateMentionListHighlight();
            }
            
            // 更新列表高亮
            function updateMentionListHighlight() {
                const items = mentionList.querySelectorAll('.mention-item');
                items.forEach((item, index) => {
                    if (index === currentMentionIndex) {
                        item.style.backgroundColor = '#00d9a3';
                        item.style.color = 'white';
                        item.querySelector('span:last-child').style.color = 'white';
                    } else {
                        item.style.backgroundColor = '';
                        item.style.color = '';
                        item.querySelector('span:last-child').style.color = '#333';
                    }
                });
                
                // 滚动到选中项
                if (currentMentionIndex >= 0) {
                    const selectedItem = items[currentMentionIndex];
                    if (selectedItem) {
                        selectedItem.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
                    }
                }
            }
            
            // 选择提及项
            function selectMention(user) {
                const value = textarea.value;
                const textBeforeAt = value.substring(0, mentionStartPos);
                const textAfterCursor = value.substring(textarea.selectionStart);
                const mentionText = `@${user.name} `;
                
                // 替换 @ 及其后的文本
                textarea.value = textBeforeAt + mentionText + textAfterCursor;
                
                // 设置光标位置
                const newCursorPos = textBeforeAt.length + mentionText.length;
                textarea.setSelectionRange(newCursorPos, newCursorPos);
                
                // 聚焦并隐藏面板
                textarea.focus();
                hideMentionPanel();
            }
            
            // 点击外部关闭面板
            document.addEventListener('click', function(e) {
                if (!textarea.contains(e.target) && !mentionPanel.contains(e.target)) {
                    hideMentionPanel();
                }
            });
        })();
    </script>
    
</body>
</html>
