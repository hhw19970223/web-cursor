<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL批量分析系统 - 行业分类与风险评估</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }

        h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 32px;
            font-weight: 700;
        }

        .subtitle {
            color: #666;
            font-size: 16px;
            margin-bottom: 20px;
        }

        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .stat-value {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 14px;
            opacity: 0.9;
        }

        .control-panel {
            background: white;
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }

        .control-group {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .btn-success {
            background: #10b981;
            color: white;
        }

        .btn-danger {
            background: #ef4444;
            color: white;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .input-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        input[type="number"] {
            padding: 10px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            width: 150px;
        }

        .progress-section {
            background: white;
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }

        .progress-bar-container {
            width: 100%;
            height: 30px;
            background: #f0f0f0;
            border-radius: 15px;
            overflow: hidden;
            margin-bottom: 15px;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 14px;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            color: #666;
        }

        .charts-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .chart-card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }

        .chart-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #333;
        }

        .chart-container {
            width: 100%;
            height: 400px;
        }

        .table-card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .table-container {
            overflow-x: auto;
            max-height: 600px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        thead {
            position: sticky;
            top: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            z-index: 10;
        }

        th {
            padding: 15px;
            text-align: left;
            font-weight: 600;
        }

        td {
            padding: 12px 15px;
            border-bottom: 1px solid #f0f0f0;
        }

        tbody tr:hover {
            background: #f8f9fa;
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .badge-safe {
            background: #d1fae5;
            color: #065f46;
        }

        .badge-risk {
            background: #fee2e2;
            color: #991b1b;
        }

        .badge-unknown {
            background: #e5e7eb;
            color: #374151;
        }

        .url-cell {
            max-width: 300px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .log-container {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 20px;
            border-radius: 10px;
            max-height: 300px;
            overflow-y: auto;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 13px;
            line-height: 1.6;
        }

        .log-entry {
            margin-bottom: 5px;
        }

        .log-info { color: #4ec9b0; }
        .log-success { color: #4caf50; }
        .log-warning { color: #ff9800; }
        .log-error { color: #f44336; }

        @media (max-width: 768px) {
            .charts-row {
                grid-template-columns: 1fr;
            }
            
            h1 {
                font-size: 24px;
            }
            
            .stat-card {
                padding: 15px;
            }
            
            .stat-value {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <div class="header">
            <h1>🔍 URL批量分析系统</h1>
            <p class="subtitle">智能分析网站行业分类与高风险产业识别</p>
            
            <div class="stats-row">
                <div class="stat-card">
                    <div class="stat-value" id="totalUrls">0</div>
                    <div class="stat-label">总URL数量</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="analyzedUrls">0</div>
                    <div class="stat-label">已分析</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="riskUrls">0</div>
                    <div class="stat-label">高风险</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="safeUrls">0</div>
                    <div class="stat-label">安全</div>
                </div>
            </div>
        </div>

        <!-- 控制面板 -->
        <div class="control-panel">
            <h3 style="margin-bottom: 20px;">控制面板</h3>
            <div class="control-group">
                <button class="btn btn-primary" id="startBtn">
                    <span>▶️</span> 开始分析
                </button>
                <button class="btn btn-secondary" id="pauseBtn" disabled>
                    <span>⏸️</span> 暂停
                </button>
                <button class="btn btn-secondary" id="stopBtn" disabled>
                    <span>⏹️</span> 停止
                </button>
                <button class="btn btn-success" id="exportBtn">
                    <span>📥</span> 导出报告
                </button>
                
                <div class="input-group">
                    <label>分析数量:</label>
                    <input type="number" id="limitInput" value="100" min="1" max="10000">
                </div>
                
                <div class="input-group">
                    <label>并发数:</label>
                    <input type="number" id="concurrentInput" value="3" min="1" max="10">
                </div>
            </div>
        </div>

        <!-- 进度条 -->
        <div class="progress-section">
            <h3 style="margin-bottom: 15px;">分析进度</h3>
            <div class="progress-bar-container">
                <div class="progress-bar" id="progressBar" style="width: 0%;">0%</div>
            </div>
            <div class="progress-info">
                <span id="progressText">等待开始...</span>
                <span id="speedText">速度: 0 URL/s</span>
            </div>
            
            <div class="log-container" id="logContainer" style="margin-top: 20px;">
                <div class="log-entry log-info">系统就绪，等待开始分析...</div>
            </div>
        </div>

        <!-- 图表展示 -->
        <div class="charts-row">
            <div class="chart-card">
                <div class="chart-title">📊 行业分类分布</div>
                <div class="chart-container" id="industryChart"></div>
            </div>
            <div class="chart-card">
                <div class="chart-title">⚠️ 风险等级分布</div>
                <div class="chart-container" id="riskChart"></div>
            </div>
        </div>

        <!-- 数据表格 -->
        <div class="table-card">
            <h3 style="margin-bottom: 20px;">📋 分析结果详情</h3>
            <div class="table-container">
                <table id="resultsTable">
                    <thead>
                        <tr>
                            <th>序号</th>
                            <th>URL</th>
                            <th>标题</th>
                            <th>关键词</th>
                            <th>描述</th>
                            <th>网站摘要</th>
                            <th>行业分类</th>
                            <th>风险评估</th>
                            <th>状态</th>
                        </tr>
                    </thead>
                    <tbody id="resultsTableBody">
                        <tr>
                            <td colspan="9" style="text-align: center; padding: 30px; color: #999;">
                                暂无数据，请点击"开始分析"按钮
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/echarts@latest/dist/echarts.min.js"></script>
    <script>
        // 全局变量
        let sourceData = null;
        let analyzedResults = [];
        let isAnalyzing = false;
        let isPaused = false;
        let currentIndex = 0;
        let startTime = 0;

        // 行业关键词映射
        const industryKeywords = {
            '电子商务': ['shop', 'store', 'buy', 'sell', 'cart', 'product', 'ecommerce', 'shopping', '商城', '购物', '电商'],
            '金融服务': ['bank', 'finance', 'loan', 'credit', 'payment', 'invest', 'trading', '金融', '银行', '贷款', '投资'],
            '科技/IT': ['tech', 'software', 'app', 'code', 'dev', 'api', 'cloud', 'ai', '科技', '软件', '开发'],
            '教育培训': ['education', 'learn', 'course', 'training', 'school', 'university', '教育', '培训', '学习', '课程'],
            '医疗健康': ['health', 'medical', 'hospital', 'doctor', 'medicine', 'clinic', '医疗', '健康', '医院'],
            '房地产': ['real estate', 'property', 'house', 'rent', 'apartment', 'zillow', '房产', '租房', '地产'],
            '汽车': ['car', 'auto', 'vehicle', 'motor', 'lease', 'automotive', '汽车', '车辆'],
            '媒体/娱乐': ['media', 'news', 'blog', 'video', 'music', 'game', 'entertainment', '媒体', '娱乐', '游戏'],
            '社交网络': ['social', 'community', 'forum', 'reddit', 'facebook', 'twitter', '社交', '论坛'],
            '餐饮美食': ['food', 'restaurant', 'delivery', 'menu', 'dining', 'swiggy', '餐饮', '美食'],
            '旅游': ['travel', 'hotel', 'booking', 'tourism', 'vacation', '旅游', '酒店'],
            '企业服务': ['business', 'enterprise', 'service', 'management', 'hr', 'crm', '企业', '管理'],
        };

        // 高风险关键词
        const riskKeywords = [
            'casino', 'gambling', 'bet', 'porn', 'adult', 'xxx', 
            'drugs', 'loan shark', 'scam', 'hack', 'crack',
            '博彩', '赌博', '色情', '成人', '高利贷', '诈骗', '黑客'
        ];

        // 初始化
        async function init() {
            addLog('正在加载数据...', 'info');
            try {
                const response = await fetch('/api/json/123456');
                sourceData = await response.json();
                
                if (sourceData && sourceData.Sheet1) {
                    const totalCount = sourceData.Sheet1.length;
                    document.getElementById('totalUrls').textContent = totalCount.toLocaleString();
                    addLog(`数据加载成功！共 ${totalCount} 条URL记录`, 'success');
                    
                    // 初始化图表
                    initCharts();
                } else {
                    addLog('数据格式错误', 'error');
                }
            } catch (error) {
                addLog(`数据加载失败: ${error.message}`, 'error');
                // 使用模拟数据用于演示
                addLog('使用模拟数据进行演示...', 'warning');
                sourceData = { Sheet1: [] };
                setTimeout(() => {
                    startAnalysis();
                }, 1000);
            }
        }

        // 初始化图表
        function initCharts() {
            const industryChart = echarts.init(document.getElementById('industryChart'));
            const riskChart = echarts.init(document.getElementById('riskChart'));

            const industryOption = {
                tooltip: {
                    trigger: 'item',
                    formatter: '{b}: {c} ({d}%)'
                },
                legend: {
                    orient: 'vertical',
                    right: 10,
                    top: 'center',
                    textStyle: { fontSize: 12 }
                },
                series: [{
                    type: 'pie',
                    radius: ['40%', '70%'],
                    avoidLabelOverlap: false,
                    itemStyle: {
                        borderRadius: 10,
                        borderColor: '#fff',
                        borderWidth: 2
                    },
                    label: {
                        show: false
                    },
                    emphasis: {
                        label: {
                            show: true,
                            fontSize: 16,
                            fontWeight: 'bold'
                        }
                    },
                    data: []
                }]
            };

            const riskOption = {
                tooltip: {
                    trigger: 'axis',
                    axisPointer: { type: 'shadow' }
                },
                xAxis: {
                    type: 'category',
                    data: ['安全', '可疑', '高风险', '未知'],
                    axisLabel: { fontSize: 12 }
                },
                yAxis: {
                    type: 'value',
                    axisLabel: { fontSize: 12 }
                },
                series: [{
                    type: 'bar',
                    data: [0, 0, 0, 0],
                    itemStyle: {
                        color: (params) => {
                            const colors = ['#10b981', '#f59e0b', '#ef4444', '#6b7280'];
                            return colors[params.dataIndex];
                        },
                        borderRadius: [10, 10, 0, 0]
                    }
                }]
            };

            industryChart.setOption(industryOption);
            riskChart.setOption(riskOption);

            window.industryChart = industryChart;
            window.riskChart = riskChart;

            // 响应式
            window.addEventListener('resize', () => {
                industryChart.resize();
                riskChart.resize();
            });
        }

        // 模拟URL分析
        async function analyzeUrl(url, index) {
            // 模拟网络请求延迟
            await new Promise(resolve => setTimeout(resolve, Math.random() * 1000 + 500));

            // 模拟提取数据
            const domain = extractDomain(url);
            const title = `${domain} - 网站标题`;
            const keywords = generateKeywords(url);
            const description = `这是 ${domain} 的网站描述，提供各种服务...`;
            const summary = generateSummary(url, keywords);
            const industry = classifyIndustry(url, keywords, title, description);
            const risk = assessRisk(url, keywords, title, description);

            return {
                index: index + 1,
                url,
                title,
                keywords,
                description,
                summary,
                industry,
                risk,
                status: 'completed'
            };
        }

        // 提取域名
        function extractDomain(url) {
            try {
                const urlObj = new URL(url);
                return urlObj.hostname.replace('www.', '');
            } catch {
                return url;
            }
        }

        // 生成关键词
        function generateKeywords(url) {
            const domain = extractDomain(url).toLowerCase();
            const keywords = [];
            
            // 从域名提取关键词
            const parts = domain.split('.');
            keywords.push(...parts[0].split('-'));
            
            // 添加一些相关关键词
            if (domain.includes('shop') || domain.includes('store')) {
                keywords.push('ecommerce', 'shopping');
            }
            if (domain.includes('tech') || domain.includes('dev')) {
                keywords.push('technology', 'software');
            }
            
            return keywords.slice(0, 5).join(', ');
        }

        // 生成摘要
        function generateSummary(url, keywords) {
            const domain = extractDomain(url);
            return `${domain} 是一个专注于 ${keywords.split(',')[0]} 相关服务的网站，为用户提供优质的在线体验和专业服务。`;
        }

        // 行业分类
        function classifyIndustry(url, keywords, title, description) {
            const text = `${url} ${keywords} ${title} ${description}`.toLowerCase();
            
            let maxScore = 0;
            let detectedIndustry = '其他';
            
            for (const [industry, kws] of Object.entries(industryKeywords)) {
                let score = 0;
                for (const kw of kws) {
                    if (text.includes(kw.toLowerCase())) {
                        score++;
                    }
                }
                if (score > maxScore) {
                    maxScore = score;
                    detectedIndustry = industry;
                }
            }
            
            return detectedIndustry;
        }

        // 风险评估
        function assessRisk(url, keywords, title, description) {
            const text = `${url} ${keywords} ${title} ${description}`.toLowerCase();
            
            let riskScore = 0;
            for (const kw of riskKeywords) {
                if (text.includes(kw.toLowerCase())) {
                    riskScore++;
                }
            }
            
            if (riskScore >= 2) return '高风险';
            if (riskScore === 1) return '可疑';
            
            // 随机模拟一些风险（用于演示）
            const random = Math.random();
            if (random < 0.05) return '高风险';
            if (random < 0.15) return '可疑';
            return '安全';
        }

        // 开始分析
        async function startAnalysis() {
            if (isAnalyzing) return;
            
            isAnalyzing = true;
            isPaused = false;
            startTime = Date.now();
            
            document.getElementById('startBtn').disabled = true;
            document.getElementById('pauseBtn').disabled = false;
            document.getElementById('stopBtn').disabled = false;
            
            const limit = parseInt(document.getElementById('limitInput').value) || 100;
            const concurrent = parseInt(document.getElementById('concurrentInput').value) || 3;
            
            addLog(`开始分析，目标: ${limit} 个URL，并发数: ${concurrent}`, 'info');
            
            const urls = sourceData.Sheet1.slice(0, limit).map(item => item['提取页面url']);
            const total = urls.length;
            
            // 批量分析
            for (let i = 0; i < total; i += concurrent) {
                if (!isAnalyzing) break;
                
                while (isPaused) {
                    await new Promise(resolve => setTimeout(resolve, 100));
                }
                
                const batch = urls.slice(i, i + concurrent);
                const promises = batch.map((url, idx) => analyzeUrl(url, i + idx));
                
                try {
                    const results = await Promise.all(promises);
                    analyzedResults.push(...results);
                    
                    // 更新UI
                    updateStats();
                    updateProgress(analyzedResults.length, total);
                    updateTable();
                    updateCharts();
                    
                    addLog(`已完成 ${analyzedResults.length}/${total}`, 'success');
                } catch (error) {
                    addLog(`批次分析出错: ${error.message}`, 'error');
                }
            }
            
            if (isAnalyzing) {
                addLog('分析完成！', 'success');
                stopAnalysis();
            }
        }

        // 暂停分析
        function pauseAnalysis() {
            isPaused = !isPaused;
            const btn = document.getElementById('pauseBtn');
            if (isPaused) {
                btn.innerHTML = '<span>▶️</span> 继续';
                addLog('分析已暂停', 'warning');
            } else {
                btn.innerHTML = '<span>⏸️</span> 暂停';
                addLog('分析继续中...', 'info');
            }
        }

        // 停止分析
        function stopAnalysis() {
            isAnalyzing = false;
            isPaused = false;
            
            document.getElementById('startBtn').disabled = false;
            document.getElementById('pauseBtn').disabled = true;
            document.getElementById('stopBtn').disabled = true;
            document.getElementById('pauseBtn').innerHTML = '<span>⏸️</span> 暂停';
        }

        // 更新统计
        function updateStats() {
            const total = analyzedResults.length;
            const riskCount = analyzedResults.filter(r => r.risk === '高风险').length;
            const safeCount = analyzedResults.filter(r => r.risk === '安全').length;
            
            document.getElementById('analyzedUrls').textContent = total;
            document.getElementById('riskUrls').textContent = riskCount;
            document.getElementById('safeUrls').textContent = safeCount;
        }

        // 更新进度
        function updateProgress(current, total) {
            const percentage = Math.round((current / total) * 100);
            const progressBar = document.getElementById('progressBar');
            progressBar.style.width = percentage + '%';
            progressBar.textContent = percentage + '%';
            
            const elapsed = (Date.now() - startTime) / 1000;
            const speed = (current / elapsed).toFixed(2);
            
            document.getElementById('progressText').textContent = `已分析 ${current}/${total} 个URL`;
            document.getElementById('speedText').textContent = `速度: ${speed} URL/s`;
        }

        // 更新表格
        function updateTable() {
            const tbody = document.getElementById('resultsTableBody');
            const lastResults = analyzedResults.slice(-10).reverse();
            
            tbody.innerHTML = lastResults.map(result => `
                <tr>
                    <td>${result.index}</td>
                    <td class="url-cell" title="${result.url}">${result.url}</td>
                    <td>${result.title}</td>
                    <td>${result.keywords}</td>
                    <td style="max-width: 200px; overflow: hidden; text-overflow: ellipsis;">${result.description}</td>
                    <td>${result.summary}</td>
                    <td><strong>${result.industry}</strong></td>
                    <td>
                        <span class="badge ${result.risk === '安全' ? 'badge-safe' : result.risk === '高风险' ? 'badge-risk' : 'badge-unknown'}">
                            ${result.risk}
                        </span>
                    </td>
                    <td>✅ 完成</td>
                </tr>
            `).join('');
        }

        // 更新图表
        function updateCharts() {
            // 行业分布
            const industryCount = {};
            analyzedResults.forEach(result => {
                industryCount[result.industry] = (industryCount[result.industry] || 0) + 1;
            });
            
            const industryData = Object.entries(industryCount).map(([name, value]) => ({
                name, value
            }));
            
            window.industryChart.setOption({
                series: [{ data: industryData }]
            });
            
            // 风险分布
            const riskCount = { '安全': 0, '可疑': 0, '高风险': 0, '未知': 0 };
            analyzedResults.forEach(result => {
                riskCount[result.risk] = (riskCount[result.risk] || 0) + 1;
            });
            
            window.riskChart.setOption({
                series: [{ data: Object.values(riskCount) }]
            });
        }

        // 导出报告
        function exportReport() {
            if (analyzedResults.length === 0) {
                alert('暂无数据可导出');
                return;
            }
            
            const csv = convertToCSV(analyzedResults);
            downloadCSV(csv, 'url_analysis_report.csv');
            addLog('报告导出成功', 'success');
        }

        // 转换为CSV
        function convertToCSV(data) {
            const headers = ['序号', 'URL', '标题', '关键词', '描述', '网站摘要', '行业分类', '风险评估'];
            const rows = data.map(row => [
                row.index,
                row.url,
                row.title,
                row.keywords,
                row.description,
                row.summary,
                row.industry,
                row.risk
            ]);
            
            return [headers, ...rows].map(row => 
                row.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(',')
            ).join('\n');
        }

        // 下载CSV
        function downloadCSV(csv, filename) {
            const BOM = '\uFEFF';
            const blob = new Blob([BOM + csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = filename;
            link.click();
        }

        // 添加日志
        function addLog(message, type = 'info') {
            const container = document.getElementById('logContainer');
            const time = new Date().toLocaleTimeString();
            const entry = document.createElement('div');
            entry.className = `log-entry log-${type}`;
            entry.textContent = `[${time}] ${message}`;
            container.appendChild(entry);
            container.scrollTop = container.scrollHeight;
            
            // 限制日志数量
            if (container.children.length > 100) {
                container.removeChild(container.firstChild);
            }
        }

        // 事件监听
        document.getElementById('startBtn').addEventListener('click', startAnalysis);
        document.getElementById('pauseBtn').addEventListener('click', pauseAnalysis);
        document.getElementById('stopBtn').addEventListener('click', () => {
            stopAnalysis();
            addLog('分析已停止', 'warning');
        });
        document.getElementById('exportBtn').addEventListener('click', exportReport);

        // 页面加载完成后初始化
        window.addEventListener('load', init);
    </script>
</body>
</html>
